services:
  bot:
    build: .
    image: personal-discord-bot:local
    env_file:
      - path: .env
        format: raw
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
